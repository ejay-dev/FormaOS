name: FormaOS Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_nightly_suite:
        description: 'Run the heavier nightly-style checks now'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 15 * * *'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  FORCE_COLOR: '1'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || '' }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
  STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL || '' }}

jobs:
  core:
    name: Core Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: SECURITY_BASELINE_STRICT=1 npm run check:security-baseline
      - run: npm run build
      - run: npm run check:app-links
      - run: npm run db:test:verify

  playwright-integrity:
    name: Playwright Integrity Gate
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run smoke, app action, and export integrity suites
        run: >
          npx playwright test
          e2e/smoke.spec.ts
          e2e/app-link-integrity.spec.ts
          e2e/app-action-integrity.spec.ts
          e2e/export-integrity.spec.ts
          --project=chromium
          --reporter=list
          --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-integrity-artifacts
          path: |
            test-results/
            playwright-report/

  nightly:
    name: Nightly Quality Sweep
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.run_nightly_suite == true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Full Playwright regression
        run: >
          npx playwright test
          e2e/onboarding-flow.spec.ts
          e2e/care-plans.spec.ts
          e2e/task-flow.spec.ts
          e2e/forms-new.spec.ts
          e2e/incident-investigation.spec.ts
          e2e/dashboard-truthful.spec.ts
          e2e/deep-workflow-integrity.spec.ts
          e2e/system-integration.spec.ts
          --project=chromium
          --reporter=list
          --workers=1

      - name: Accessibility coverage
        run: npm run test:a11y

      - name: Install k6
        run: |
          sudo gpg -k || true
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start app for k6
        run: |
          npm run build
          npm run start &
          echo $! > app.pid
          npx wait-on http://localhost:3000 --timeout 120000

      - name: k6 public light load
        run: BASE_URL=http://localhost:3000 VUS=3 DURATION=45s npm run load:public

      - name: ZAP staging baseline
        if: env.STAGING_BASE_URL != ''
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.STAGING_BASE_URL }}
          fail_action: true
          cmd_options: '-a -m 5'

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-quality-artifacts
          path: |
            test-results/
            playwright-report/
            .lighthouseci/
