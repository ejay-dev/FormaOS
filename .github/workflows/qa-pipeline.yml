name: Professional SaaS QA Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, qa-upgrades/*]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E tests for faster feedback'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  security-events: write

env:
  NODE_VERSION: '20'
  FORCE_COLOR: 1
  # Workflow-wide opt-out for the strict env check in
  # scripts/check-env.js. Both `npm run build` (prebuild) and
  # `npm run start` (prestart) invoke it. Vercel builds still validate
  # strictly because VERCEL_ENV=production short-circuits this opt-out.
  CHECK_ENV_SKIP_IN_CI: '1'

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - name: ESLint
        # Ceiling tightened from 350 (Blocker 4). lint-warning-ratchet.yml
        # opens a PR to lower this when warning count drops further.
        run: npx eslint . --max-warnings 25
      - run: npm run stylelint
      - run: npm run type-check

      - name: App route/link integrity check
        run: npm run check:app-links

      - name: Admin sidebar route integrity check
        run: npm run check:admin-nav

      - name: Code formatting check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,md,json}"
        continue-on-error: true # Warning only for formatting

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # v4-028: live-database RLS contract suite. Pre-fix this suite was
  # gated on RUN_INTEGRATION_TESTS=1 set by zero workflows, so the
  # 14-table tenant-isolation guard never ran in CI. Now scheduled
  # nightly via the formaos-quality-gates workflow, and gated here
  # behind repository secrets so unprivileged forks still pass.
  rls-contract:
    name: RLS Contract (live Supabase)
    runs-on: ubuntu-latest
    if: >-
      vars.RUN_INTEGRATION_TESTS == '1' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'rls-required')
    env:
      RUN_INTEGRATION_TESTS: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run RLS integration suite
        run: npx jest __tests__/integration/rls --runInBand

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # v4-031: npm audit is now blocking — it catches real prod-dep
      # CVEs with no external dependency. --omit=dev so dev-dep churn
      # doesn't block PRs.
      - name: Run npm audit (production deps)
        run: npm audit --audit-level=high --omit=dev

      # Snyk runs only when SNYK_TOKEN is configured on the repo.
      # Fork PRs and environments without the secret skip cleanly
      # rather than failing on authentication errors. When the token
      # is present, the step IS blocking — high-severity findings
      # fail the merge.
      - name: Check Snyk token availability
        id: snyk-token-check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNYK_TOKEN not configured — skipping Snyk scan (npm audit still blocks)"
          fi

      - name: Run Snyk to check for vulnerabilities
        if: steps.snyk-token-check.outputs.available == 'true'
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # pin to SHA
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # CodeQL only runs on push to default branch (not PRs). The
      # action above guards with `if: github.event_name != 'pull_request'`.
      - name: CodeQL Analysis
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: CodeQL Analyze
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/analyze@v3

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      - run: npm run start &
      - run: npx wait-on http://localhost:3000
      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          PW_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_e2e != 'true'
    # Job-level env so both the full and smoke E2E steps inherit it
    # without duplicating the block.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || '' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL || '' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL || '' }}
      # 2026-05-15: CI runs the Next server via `npm run start` which
      # sets NODE_ENV=production, so `isDevelopmentLoopbackOrigin` in
      # lib/security/csrf.ts no longer auto-trusts http://localhost.
      # NEXT_PUBLIC_APP_URL is intentionally empty for fork PRs, so we
      # cannot rely on it as the trust anchor here. Allow the test
      # server's own loopback as a trusted CSRF origin specifically for
      # the E2E job so the auth-bootstrap POST (which now sends Origin)
      # passes the gate. This setting is scoped to the e2e-tests job
      # and does not affect the rest of the workflow.
      CSRF_TRUSTED_ORIGINS: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Detect Supabase E2E env
        id: e2e_env
        # Three outcomes, by intent:
        #
        #   1. Secrets present  → run the full 806-test chromium suite.
        #   2. Secrets missing, PR is from a fork → run the smoke fallback.
        #      Forks cannot access repo secrets by GitHub policy; smoke is
        #      the best honest signal available.
        #   3. Secrets missing on a home-repo push/PR → fail the job.
        #      This is the release gate. If it cannot run, it must not
        #      pretend to. Until 2026-05-14 this branch silently fell back
        #      to smoke and reported success; the result was 15 consecutive
        #      green merges on main where the 806-test suite never ran.
        #      That is the green-tests-theater pattern. Fail fast forces
        #      either adding the SUPABASE_SERVICE_ROLE_KEY +
        #      NEXT_PUBLIC_SUPABASE_URL secrets, or an explicit
        #      workflow_dispatch override.
        run: |
          is_fork="${{ github.event.pull_request.head.repo.fork || 'false' }}"
          if [[ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" && -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$is_fork" == "true" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fork PR — running smoke-only fallback (secrets unavailable on fork PRs by design)."
          else
            echo "::error::Full E2E suite cannot run — repository lacks Supabase test secrets. Add SUPABASE_SERVICE_ROLE_KEY and NEXT_PUBLIC_SUPABASE_URL to GitHub Actions → Repository secrets. This is the release gate; it must produce real signal, not a smoke fallback."
            exit 1
          fi
      - name: Run E2E tests (full)
        if: steps.e2e_env.outputs.available == 'true'
        # 2026-05-15: informational, not blocking.
        #
        # The 806-test full chromium suite is a coverage net, not the
        # release gate. Measured wall time at 2 workers = ~28 min;
        # at 3 workers = ~28 min (workers aren't the bottleneck —
        # the Next dev server and shared Supabase serialize at the
        # request layer regardless of test parallelism). Bumping
        # timeout further would just mean slower PR feedback for
        # tests that aren't gating production readiness.
        #
        # The actual release gate is `Playwright Integrity Gate`
        # in formaos-quality-gates.yml, which runs the critical
        # path: smoke + app-link-integrity + app-action-integrity
        # + export-integrity. That gate is proven and blocking.
        #
        # Keeping `continue-on-error: true` here means the full
        # suite still RUNS — its report artifact is uploaded, real
        # bugs surface in the artifact and CI summary — but a
        # timeout or test failure doesn't block merge. The Quality
        # Gate aggregator job that depends on this no longer treats
        # the full-suite outcome as fatal.
        #
        # When the suite's structural bottleneck is fixed (sharding,
        # dev-server concurrency, or fixture isolation), drop this
        # flag and the full suite becomes blocking again.
        # v4-028: keeps non-blocking by default to preserve PR
        # velocity while the structural bottleneck (dev-server
        # serialization, workspace-seed contention) is being fixed.
        # Set repository var E2E_GATE_STRICT=true to flip this gate
        # to blocking — the dependent check step below fails the
        # workflow if the suite failed.
        # Audit Sprint 2 (2026-05-23): continue-on-error is now
        # conditional on the strict-mode var. When E2E_GATE_STRICT=true
        # the step itself goes red on failure (not only the sidecar
        # gate at line 287), so the GitHub UI reflects the actual
        # outcome instead of a misleading ✓.
        continue-on-error: ${{ vars.E2E_GATE_STRICT != 'true' }}
        id: full_e2e
        run: npx playwright test --project=chromium
        timeout-minutes: 30
      - name: Strict E2E gate (opt-in)
        if: vars.E2E_GATE_STRICT == 'true' && steps.full_e2e.outcome == 'failure'
        run: |
          echo "❌ Strict E2E gate enabled and the full Playwright suite failed."
          echo "Either fix the failing specs, quarantine them under e2e/quarantine/,"
          echo "or unset the repository variable E2E_GATE_STRICT to revert to"
          echo "advisory mode while the gate is being stabilised."
          exit 1
      - name: Run E2E smoke (env-independent fallback)
        if: steps.e2e_env.outputs.available != 'true'
        # Marketing smoke + app-link integrity have their own env-skip
        # guards. Running just these two keeps the gate honest in
        # secret-less CI without the 20-minute timeout the full suite
        # was hitting because of cascading workspace-seed throws.
        run: npx playwright test e2e/smoke.spec.ts e2e/app-link-integrity.spec.ts --project=chromium --reporter=list
        timeout-minutes: 10

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      - run: npm run start &
      - run: npx wait-on http://localhost:3000
      - name: Run visual regression tests
        run: npm run test:visual
        env:
          PW_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Visual Verification Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-verification-artifacts
          path: |
            screenshots/marketing/
            test-results/

  performance-tests:
    name: Performance & SEO Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # v4-031: lighthouse-ci's startServerCommand runs `npm run build &&
      # npm run start`. If NEXT_PUBLIC_SUPABASE_URL is missing or empty,
      # `npm run prestart` fails (check-env strict) or the SSR boot
      # throws on first request, Lighthouse's Chrome hits a dead port,
      # and the job fails with CHROME_INTERSTITIAL_ERROR. That failure
      # is environmental — not signal about the code under test. Gate
      # the whole job on the secret being present (same pattern as
      # Snyk above); when configured the gate IS blocking.
      - name: Check Supabase env availability
        id: supabase-env-check
        env:
          SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          SUPA_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
        run: |
          if [ -n "$SUPA_URL" ] && [ -n "$SUPA_ANON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY not configured — skipping Lighthouse (a prod build needs them to serve /)"
          fi

      - name: Build application
        if: steps.supabase-env-check.outputs.available == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      # lighthouse-ci startServerCommand runs `npm run start` against the built app
      - name: Run Lighthouse CI
        if: steps.supabase-env-check.outputs.available == 'true'
        run: npm run test:lighthouse
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

      - name: Bundle size check
        if: steps.supabase-env-check.outputs.available == 'true'
        # Audit Sprint 2 (2026-05-23): replaced the no-op `ls -la` with a
        # real assertion (scripts/check-bundle-size.mjs). Caps are
        # generous over current actuals; tighten over time as the
        # team trims chunks. continue-on-error removed — silent passes
        # were the original gap.
        run: |
          npm run build
          node scripts/check-bundle-size.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

      - name: Upload Lighthouse Report
        if: steps.supabase-env-check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/

  database-tests:
    name: Database & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - name: Run DB integrity tests
        run: npm run test:db
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      - name: Run Supabase health check
        run: npm run test:supabase-health
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

      # Audit Sprint 2 (2026-05-23): orgs ↔ organizations drift gate.
      # `scripts/check-orgs-sync.mjs` already exits 0/1 on drift; without
      # secrets it auto-skips with exit 0 so forks don't break.
      - name: Orgs ↔ organizations drift gate
        run: npm run test:db:orgs-sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-format,
        unit-tests,
        security-scan,
        accessibility-tests,
        e2e-tests,
        visual-regression,
        performance-tests,
        database-tests,
      ]
    if: always()
    steps:
      - name: Quality Gate Results
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint-and-format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression | ${{ needs.visual-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ${{ needs.database-tests.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint-and-format.result }}" != "success" ||
                "${{ needs.unit-tests.result }}" != "success" ||
                "${{ needs.security-scan.result }}" != "success" ||
                "${{ needs.accessibility-tests.result }}" != "success" ||
                "${{ needs.e2e-tests.result }}" != "success" && "${{ needs.e2e-tests.result }}" != "skipped" ||
                "${{ needs.visual-regression.result }}" != "success" ||
                "${{ needs.performance-tests.result }}" != "success" ||
                "${{ needs.database-tests.result }}" != "success" ]]; then
            echo "Quality gate failed - one or more checks failed"
            exit 1
          fi
          echo "All quality checks passed! Ready for merge."
